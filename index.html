<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roue libre</title>
<!--
  Roue libre, Sindry's game in 3D: the wheel of Sindry's icon runs through a
  city drawn in black ink on white. Keyboard or gamepad. No build step: the
  page loads its ES modules as they are, and three.js from vendor/. Over the
  3D, a 2D canvas paints the grunge effects and the speedometer.
-->
<style>
@font-face { font-family: 'Sindry Mono'; font-weight: 400; src: url('fonts/sindry-mono-400.woff2') format('woff2'); }
@font-face { font-family: 'Sindry Mono'; font-weight: 500 800; src: url('fonts/sindry-mono-500.woff2') format('woff2'); }
:root { --encre: #141A24; --papier: #FFFFFF; --mono: 'Sindry Mono', Consolas, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--papier); color: var(--encre); font: 13px/1.4 var(--mono); }
#scene, #effets { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#effets { pointer-events: none; }
button { font: inherit; color: inherit; }

/* The HUD. */
.hud { position: fixed; inset: 0; pointer-events: none; padding: 16px 20px; }
.hud-g { position: absolute; left: 20px; top: 16px; }
.hud-d { position: absolute; right: 20px; top: 14px; text-align: right; }
.hud b { display: block; font-size: 13px; letter-spacing: .08em; }
#score { font-size: 22px; font-weight: 700; }
.discret { opacity: .7; font-size: 11.5px; }
.avance { position: absolute; left: 50%; top: 22px; width: min(360px, 34vw); height: 2px; transform: translateX(-50%); background: color-mix(in srgb, var(--encre) 30%, transparent); }
.avance i { position: absolute; left: 0; top: -1px; height: 4px; background: var(--encre); }
.avance::after { content: ''; position: absolute; right: -14px; top: -4px; width: 10px; height: 10px; background: conic-gradient(var(--encre) 25%, var(--papier) 0 50%, var(--encre) 0 75%, var(--papier) 0); border: 1px solid var(--encre); }
#multi { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); font-weight: 800; letter-spacing: .12em; font-size: 14px; }
#message { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 700; letter-spacing: .25em; opacity: 0; pointer-events: none; text-shadow: 0 0 6px var(--papier), 0 0 12px var(--papier); }
#message.vu { animation: dit 1.2s ease-out; }
@keyframes dit { 0% { opacity: 0; transform: translate(-50%, -30%); } 15% { opacity: 1; transform: translate(-50%, -50%); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
.vies { display: inline-flex; gap: 4px; vertical-align: middle; }
.vies i { width: 12px; height: 10px; background: var(--encre); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); opacity: .2; }
.vies i.on { opacity: 1; }
#vies { margin-top: 6px; }

/* Screens. */
#ecran { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--papier) 72%, transparent); }
#ecran[hidden] { display: none; }
.carte { background: var(--papier); border: 2px solid var(--encre); border-radius: 6px; padding: 16px 22px; max-width: 100%; max-height: 100%; overflow: auto; }
.centre { text-align: center; padding: 20px 34px; }
.titre { font-size: 26px; font-weight: 700; letter-spacing: .3em; margin-bottom: 6px; }
.carte p { margin: 5px 0; }
.pale { opacity: .62; }
.boutons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.boutons.petits button, .bouton { font-size: 11.5px; padding: 4px 10px; }
.bouton { display: inline-flex; align-items: center; border: 2px solid var(--encre); border-radius: 4px; cursor: pointer; font-weight: 600; }
.bouton:hover { background: var(--encre); color: var(--papier); }
.petit { font-size: 11px; margin-top: 10px; }
.carte button { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 2px solid var(--encre); border-radius: 4px; background: var(--papier); cursor: pointer; font-weight: 600; }
.carte button:hover:not(:disabled), .carte button.primaire { background: var(--encre); color: var(--papier); }
.carte button:disabled { opacity: .3; cursor: default; }
kbd { font: 600 10.5px var(--mono); border: 1px solid currentColor; border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; }
kbd.pad { display: none; border-radius: 999px; padding: 0 6px; }
body.manette kbd.kb { display: none; }
body.manette kbd.pad { display: inline; }
.reglages { width: min(900px, 100%); }
.entete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px dashed var(--encre); padding-bottom: 6px; margin-bottom: 8px; }
.entete b { letter-spacing: .22em; text-transform: uppercase; }
.cols { display: grid; grid-template-columns: 1fr 1.3fr; gap: 22px; }
.cols.seule { grid-template-columns: 1fr; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.recap table { width: 100%; border-collapse: collapse; }
.recap td { padding: 2px 0; }
.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.somme td { border-top: 1px solid var(--encre); padding-top: 5px; font-weight: 700; }
.total td { font-weight: 700; font-size: 14px; }
.points { margin-bottom: 6px; }
.regl { display: grid; grid-template-columns: 54px 72px 64px auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 3px 0; }
.regl button { width: 26px; height: 24px; padding: 0; justify-content: center; }
.regl .pale { font-size: 11px; }
.niv { font-weight: 700; }
.sep { border-top: 1px dashed var(--encre); margin: 6px 0; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="effets"></canvas>
<div class="hud">
  <div class="hud-g"><b id="course">COURSE 1</b><span id="distance">0 m</span><div id="vies"></div></div>
  <div class="avance"><i id="avance"></i></div>
  <div id="multi"></div>
  <div class="hud-d"><span id="score">0</span><div class="discret" id="total"></div></div>
</div>
<div id="message"></div>
<div id="ecran" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
